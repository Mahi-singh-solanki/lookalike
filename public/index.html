<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cursor Tracker</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <section id="join-screen" class="card">
        <h1>Live Cursor Canvas</h1>
        <p>Enter your username and start moving your cursor.</p>
        <form id="join-form">
          <label for="username">Username</label>
          <input id="username" name="username" maxlength="24" required placeholder="e.g. Dhruv" />
          <button type="submit">Join</button>
        </form>
      </section>

      <section id="canvas-screen" class="hidden">
        <header class="toolbar">
          <div id="you-label">You:</div>
          <div id="status">Connected</div>
        </header>
        <div id="canvas-wrap">
          <canvas id="tracker-canvas" width="1000" height="600"></canvas>
        </div>
      </section>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script src="app.js"></script>
  </body>
</html>
